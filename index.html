<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wastebasket</title>
  <link rel="stylesheet" href="wastebasket-styles.css">
</head>
<body>
  <main class="workspace">
    <section class="typewriter" aria-live="off">
      <div class="custom-caret" aria-hidden="true"></div>
      <textarea
        id="typeInput"
        rows="4"
        placeholder="Write the fucking words down"
        aria-label="Plain text writing surface"
        aria-autocomplete="none"
        aria-live="off"
        lang="zxx"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        autocomplete="off"
        inputmode="text"
        data-gramm="false"
        data-enable-grammarly="false"
        data-ms-editor="false"
        translate="no"
      ></textarea>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <nav class="toolbar" aria-label="Writing actions">
    <button id="tossBtn" type="button" class="secondary">Toss</button>
    <button id="copyBtn" type="button">Copy</button>
    <button id="saveBtn" type="button" class="secondary">Save</button>
    <button id="fullscreenBtn" type="button" aria-pressed="false">Fullscreen</button>
  </nav>

  <script src="wastebasket-app.js" defer></script>
</body>
</html>
