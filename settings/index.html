<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wastebasket - Settings</title>
  <link rel="icon" href="../wastebasket-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="../wastebasket-512.png" sizes="512x512">
  <link rel="stylesheet" href="../wastebasket-styles.css">
</head>
<body data-writing-font="mono">
  <main class="settings">
    <div class="settings__layout">
      <aside class="settings__sidebar" aria-label="Page navigation">
        <div class="toolbar-item toolbar-item--back">
          <a class="toolbar-action" href="../index.html" aria-label="Back to writing surface">

                <defs>

          </a>
          <span class="toolbar-label">Back</span>
        </div>
      </aside>

      <div class="settings__content">
        <div class="settings__header">
          <h1>Settings</h1>
        </div>
        <section aria-labelledby="font-settings-heading">
          <h2 id="font-settings-heading">Font</h2>
          <form data-font-form>
            <fieldset>
              <legend class="sr-only">Writing font</legend>
              <ul class="font-options">
                <li>
                  <label class="font-option">
                    <input type="radio" name="writingFont" value="mono" checked>
                    <span class="font-option__label">
                      <span class="font-option__name">Monospace</span>
                      <span class="writing-sample" data-writing-font="mono">All work and no play makes Jack a dull boy</span>
                    </span>
                  </label>
                </li>
                <li>
                  <label class="font-option">
                    <input type="radio" name="writingFont" value="sans">
                    <span class="font-option__label">
                      <span class="font-option__name">Sans Serif</span>
                      <span class="writing-sample" data-writing-font="sans">All work and no play makes Jack a dull boy</span>
                    </span>
                  </label>
                </li>
                <li>
                  <label class="font-option">
                    <input type="radio" name="writingFont" value="serif">
                    <span class="font-option__label">
                      <span class="font-option__name">Serif</span>
                      <span class="writing-sample" data-writing-font="serif">All work and no play makes Jack a dull boy</span>
                    </span>
                  </label>
                </li>
              </ul>
            </fieldset>
          </form>
        </section>
      </div>
    </div>
  </main>
  <script src="settings-app.js" defer></script>
</body>
</html>
